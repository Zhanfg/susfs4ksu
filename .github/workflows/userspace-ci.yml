name: SUSFS userspace CI

on:
  push:
    branches:
      - "modernize/**"
      - "next-dev"
      - "next"
    paths:
      - "ksu_susfs/**"
      - "build_ksu_susfs_tool.sh"
      - ".github/workflows/userspace-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-userspace:
    runs-on: ubuntu-latest
    env:
      NDK_RELEASE: android-ndk-r27c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/susfs-ndk"
          curl -fsSL             "https://dl.google.com/android/repository/${NDK_RELEASE}-linux.zip"             -o "${RUNNER_TEMP}/susfs-ndk/ndk.zip"
          unzip -q "${RUNNER_TEMP}/susfs-ndk/ndk.zip"             -d "${RUNNER_TEMP}/susfs-ndk"
          echo "${RUNNER_TEMP}/susfs-ndk/${NDK_RELEASE}" >> "${GITHUB_PATH}"

      - name: Build ksu_susfs
        shell: bash
        run: |
          set -euo pipefail
          ./build_ksu_susfs_tool.sh
          test -x ksu_module_susfs/tools/ksu_susfs_arm64
          file ksu_module_susfs/tools/ksu_susfs_arm64
