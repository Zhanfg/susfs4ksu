name: SUSFS full kernel CI

on:
  push:
    branches:
      - "modernize/build-pipeline"
      - "next-dev"
      - "next"
    paths:
      - "kernel_patches/**"
      - "tools/susfs-patchctl.sh"
      - ".github/workflows/kernel-ci.yml"
  workflow_dispatch:

concurrency:
  group: susfs-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: /home/runner/.cache/ccache/susfs-6.12
  CCACHE_MAXSIZE: 1200M

jobs:
  build-gki-612:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v7

      - name: Load patchset manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path("kernel_patches/patchset.json").read_text(encoding="utf-8"))
          print(f"KERNEL_REPO={data['kernel']['repository']}")
          print(f"KERNEL_BASELINE_REF={data['kernel']['baseline_ref']}")
          print(f"KERNEL_BASELINE_COMMIT={data['kernel']['baseline_commit']}")
          print(f"KERNEL_BASELINE_VERSION={data['kernel']['baseline_version']}")
          print(f"KERNEL_LANE={data['lane']}")
          print(f"KSU_REPO={data['kernelsu']['repository']}")
          print(f"KSU_BASELINE={data['kernelsu']['baseline_commit']}")
          PY

      - name: Install missing kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(bc bison flex libssl-dev libelf-dev dwarves ccache)
          missing=()

          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed'; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All kernel build dependencies are already installed."
            exit 0
          fi

          echo "Installing missing packages: ${missing[*]}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${missing[@]}"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache/susfs-6.12
          key: susfs-kernel-ccache-${{ runner.os }}-6.12-${{ github.sha }}
          restore-keys: |
            susfs-kernel-ccache-${{ runner.os }}-6.12-

      - name: Checkout immutable kernel and KernelSU baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration"

          common="$RUNNER_TEMP/integration/common"
          git init "$common"
          git -C "$common" remote add origin "$KERNEL_REPO"
          git -C "$common" fetch --depth=1 origin "$KERNEL_BASELINE_COMMIT"
          git -C "$common" checkout --detach FETCH_HEAD

          resolved="$(git -C "$common" rev-parse HEAD)"
          test "$resolved" = "$KERNEL_BASELINE_COMMIT"

          actual_version="$(
            awk -F= '
              /^VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); v=$2}
              /^PATCHLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); p=$2}
              /^SUBLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); s=$2}
              END {print v "." p "." s}
            ' "$common/Makefile"
          )"
          test "$actual_version" = "$KERNEL_BASELINE_VERSION"

          ksu="$RUNNER_TEMP/integration/KernelSU"
          git init "$ksu"
          git -C "$ksu" remote add origin "$KSU_REPO"
          git -C "$ksu" fetch --depth=1 origin "$KSU_BASELINE"
          git -C "$ksu" checkout --detach FETCH_HEAD
          test "$(git -C "$ksu" rev-parse HEAD)" = "$KSU_BASELINE"

          {
            echo "### Immutable build inputs"
            echo "- Lane: $KERNEL_LANE"
            echo "- Android release ref: $KERNEL_BASELINE_REF"
            echo "- Android SHA: $resolved"
            echo "- Kernel version: $actual_version"
            echo "- KernelSU SHA: $KSU_BASELINE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply SUSFS patchset directly
        shell: bash
        run: |
          set -euo pipefail
          ./tools/susfs-patchctl.sh apply             --require-direct             --kernel-tree "$RUNNER_TEMP/integration/common"             --ksu-tree "$RUNNER_TEMP/integration/KernelSU"

      - name: Integrate KernelSU into kernel tree
        shell: bash
        run: |
          set -euo pipefail
          kernel="$RUNNER_TEMP/integration/common"

          ln -sfn ../../KernelSU/kernel "$kernel/drivers/kernelsu"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$kernel/drivers/Makefile"             || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$kernel/drivers/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$kernel/drivers/Kconfig"             || sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' "$kernel/drivers/Kconfig"

          test -f "$kernel/drivers/kernelsu/Kconfig"
          test -f "$kernel/fs/susfs.c"
          test -f "$kernel/include/linux/susfs.h"

      - name: Configure GKI with all SUSFS features
        shell: bash
        run: |
          set -euo pipefail
          kernel="$RUNNER_TEMP/integration/common"
          out="$RUNNER_TEMP/out"

          make -C "$kernel" O="$out" ARCH=arm64 LLVM=1 gki_defconfig

          "$kernel/scripts/config" --file "$out/.config" \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -e LTO_CLANG \
            -e LTO_CLANG_THIN

          make -C "$kernel" O="$out" ARCH=arm64 LLVM=1 olddefconfig

          for cfg in \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
            CONFIG_KSU_SUSFS_SUS_MAP=y \
            CONFIG_LTO_CLANG=y \
            CONFIG_LTO_CLANG_THIN=y; do
            grep -q "^$cfg$" "$out/.config"
          done

      - name: Build complete arm64 Image
        shell: bash
        run: |
          set -euo pipefail
          kernel="$RUNNER_TEMP/integration/common"
          out="$RUNNER_TEMP/out"

          mkdir -p "$CCACHE_DIR"
          export CCACHE_BASEDIR="$kernel"
          export CCACHE_NOHASHDIR=true
          export CCACHE_COMPILERCHECK=content
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

          export KBUILD_BUILD_USER=susfs-ci
          export KBUILD_BUILD_HOST=github
          export KBUILD_BUILD_TIMESTAMP='Thu Jan  1 00:00:00 UTC 1970'

          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi

          make -C "$kernel" \
            O="$out" \
            ARCH=arm64 \
            LLVM=1 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            -j"$jobs" \
            Image

          test -s "$out/arch/arm64/boot/Image"
          ccache --show-stats

          {
            echo "### Full kernel build"
            echo "- Kernel lane: $KERNEL_LANE"
            echo "- Android common: $KERNEL_BASELINE_COMMIT ($KERNEL_BASELINE_REF)"
            echo "- KernelSU: $KSU_BASELINE"
            echo "- Image bytes: $(stat -c %s "$out/arch/arm64/boot/Image")"
            echo "- SHA256: $(sha256sum "$out/arch/arm64/boot/Image" | awk '{print $1}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel Image
        uses: actions/upload-artifact@v7
        with:
          name: susfs-next-gki-android16-6.12-${{ github.sha }}
          path: ${{ runner.temp }}/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
