name: Discover SUSFS kernel baseline

on:
  push:
    branches:
      - "modernize/build-pipeline"
    paths:
      - "kernel_patches/50_add_susfs_in_gki-android16-6.12.patch"
      - "tools/find-kernel-baseline.sh"
      - ".github/workflows/baseline-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: susfs-baseline-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v4

      - name: Clone bounded Android 16 / 6.12 history
        shell: bash
        run: |
          set -euo pipefail
          git clone             --filter=blob:none             --no-checkout             --shallow-since='2026-09-01T00:00:00Z'             --branch android16-6.12             https://android.googlesource.com/kernel/common             "$RUNNER_TEMP/common"

          patch="kernel_patches/50_add_susfs_in_gki-android16-6.12.patch"
          awk '/^diff --git a\// { p=$3; sub(/^a\//, "", p); print "/" p }' "$patch"             > "$RUNNER_TEMP/kernel-sparse.txt"

          git -C "$RUNNER_TEMP/common" sparse-checkout init --no-cone
          xargs -a "$RUNNER_TEMP/kernel-sparse.txt"             git -C "$RUNNER_TEMP/common" sparse-checkout set --no-cone
          git -C "$RUNNER_TEMP/common" checkout -q android16-6.12

      - name: Locate newest compatible source commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(
            bash tools/find-kernel-baseline.sh               --kernel-tree "$RUNNER_TEMP/common"               --before '2026-09-28T00:00:00Z'               --after '2026-09-01T00:00:00Z'
          )"
          test -n "$sha"
          echo "SUSFS_KERNEL_BASELINE=$sha" >> "$GITHUB_ENV"

          {
            echo "### Compatible Android kernel baseline"
            echo
            echo "\`$sha\`"
            echo
            git -C "$RUNNER_TEMP/common" show -s --format='- %cI %s' "$sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconfirm exact patch application
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/common" checkout -q "$SUSFS_KERNEL_BASELINE"
          git -C "$RUNNER_TEMP/common" apply --check             "$GITHUB_WORKSPACE/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch"
          echo "git apply --check: PASS" >> "$GITHUB_STEP_SUMMARY"
