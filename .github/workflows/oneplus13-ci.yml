name: OnePlus 13 SM8750 SUSFS CI

on:
  push:
    branches:
      - "vendor/oneplus13-sm8750-a16"
    paths:
      - "kernel_patches/**"
      - "tools/**"
      - ".github/workflows/oneplus13-ci.yml"
  pull_request:
    branches:
      - "next-6.6"
    paths:
      - "kernel_patches/**"
      - "tools/**"
      - ".github/workflows/oneplus13-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 2,5"

concurrency:
  group: oneplus13-susfs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v7

      - name: Load OnePlus manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          d = json.loads(Path("kernel_patches/patchset.json").read_text(encoding="utf-8"))
          print(f"KERNEL_REPO={d['kernel']['repository']}")
          print(f"KERNEL_REF={d['kernel']['baseline_ref']}")
          print(f"KERNEL_COMMIT={d['kernel']['baseline_commit']}")
          print(f"KERNEL_VERSION={d['kernel']['baseline_version']}")
          print(f"KERNEL_PATCH={d['patches']['kernel']}")
          print(f"KSU_REPO={d['kernelsu']['repository']}")
          print(f"KSU_COMMIT={d['kernelsu']['baseline_commit']}")
          print(f"VENDOR_COMMIT={d['vendor_kernel']['baseline_commit']}")
          print(f"MODULES_COMMIT={d['modules_and_devicetree']['baseline_commit']}")
          PY

      - name: Validate unified diffs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_unified_diff.py "$KERNEL_PATCH"             kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      - name: Sparse checkout exact OnePlus common kernel
        shell: bash
        run: |
          set -euo pipefail
          common="$RUNNER_TEMP/oneplus-common"
          mkdir -p "$common"

          awk '/^diff --git a\// { p=$3; sub(/^a\//, "", p); print "/" p }' "$KERNEL_PATCH"             > "$RUNNER_TEMP/oneplus-sparse.txt"
          {
            echo "/Makefile"
            echo "/arch/arm64/configs/gki_defconfig"
            echo "/fs/fuse/fuse_i.h"
            echo "/fs/fuse/Makefile"
          } >> "$RUNNER_TEMP/oneplus-sparse.txt"

          git -C "$common" init -q
          git -C "$common" remote add origin "$KERNEL_REPO"
          git -C "$common" sparse-checkout init --no-cone
          xargs -a "$RUNNER_TEMP/oneplus-sparse.txt"             git -C "$common" sparse-checkout set --no-cone
          git -C "$common" fetch --depth=1 --filter=blob:none origin "$KERNEL_COMMIT"
          git -C "$common" checkout --detach FETCH_HEAD
          test "$(git -C "$common" rev-parse HEAD)" = "$KERNEL_COMMIT"

          actual="$(
            awk -F= '
              /^VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); v=$2}
              /^PATCHLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); p=$2}
              /^SUBLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); s=$2}
              END {print v "." p "." s}
            ' "$common/Makefile"
          )"
          test "$actual" = "$KERNEL_VERSION"

          grep -q '^CONFIG_FUSE_BPF=y$' "$common/arch/arm64/configs/gki_defconfig"
          grep -q 'struct inode \*backing_inode;' "$common/fs/fuse/fuse_i.h"
          grep -q 'fuse-y += passthrough.o' "$common/fs/fuse/Makefile"

          {
            echo "### OnePlus 13 immutable common baseline"
            echo "- Branch: $KERNEL_REF"
            echo "- SHA: $KERNEL_COMMIT"
            echo "- Kernel: $actual"
            echo "- Vendor kernel SHA: $VENDOR_COMMIT"
            echo "- Modules/DT SHA: $MODULES_COMMIT"
            echo "- FUSE_BPF: enabled"
            echo "- FUSE backing inode: present"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pinned KernelSU
        shell: bash
        run: |
          set -euo pipefail
          ksu="$RUNNER_TEMP/KernelSU"
          git init -q "$ksu"
          git -C "$ksu" remote add origin "$KSU_REPO"
          git -C "$ksu" fetch --depth=1 origin "$KSU_COMMIT"
          git -C "$ksu" checkout --detach FETCH_HEAD
          test "$(git -C "$ksu" rev-parse HEAD)" = "$KSU_COMMIT"

      - name: Direct preflight on OnePlus 6.6.118
        shell: bash
        run: |
          set -euo pipefail
          bash tools/susfs-patchctl.sh check             --require-direct             --kernel-tree "$RUNNER_TEMP/oneplus-common"             --ksu-tree "$RUNNER_TEMP/KernelSU"

      - name: Apply and verify idempotency
        shell: bash
        run: |
          set -euo pipefail
          bash tools/susfs-patchctl.sh apply             --require-direct             --kernel-tree "$RUNNER_TEMP/oneplus-common"             --ksu-tree "$RUNNER_TEMP/KernelSU"
          bash tools/susfs-patchctl.sh apply             --require-direct             --kernel-tree "$RUNNER_TEMP/oneplus-common"             --ksu-tree "$RUNNER_TEMP/KernelSU"

  kmi-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v7

      - name: Load KMI pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          d = json.loads(Path("kernel_patches/patchset.json").read_text(encoding="utf-8"))
          print(f"KERNEL_REPO={d['kernel']['repository']}")
          print(f"KERNEL_COMMIT={d['kernel']['baseline_commit']}")
          print(f"KMI_PATH={d['kmi']['vendor_symbol_list']}")
          print(f"KMI_BLOB={d['kmi']['vendor_symbol_list_blob']}")
          print(f"KERNEL_PATCH={d['patches']['kernel']}")
          PY

      - name: Reject accidental ABI/UAPI/vendor-hook edits
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^diff --git a/(android/abi_|include/uapi/|include/trace/hooks/)' "$KERNEL_PATCH"; then
            echo "SUSFS patch modifies ABI/UAPI/vendor-hook surface." >&2
            exit 1
          fi

          if grep -Eq '^\+.*EXPORT_SYMBOL(_GPL)?\(' "$KERNEL_PATCH"; then
            echo "SUSFS patch adds exported symbols; explicit KMI review required." >&2
            exit 1
          fi

      - name: Verify pinned OPlus vendor symbol list blob
        shell: bash
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/oneplus-kmi"
          git init -q "$tree"
          git -C "$tree" remote add origin "$KERNEL_REPO"
          git -C "$tree" sparse-checkout init --no-cone
          git -C "$tree" sparse-checkout set --no-cone "/$KMI_PATH"
          git -C "$tree" fetch --depth=1 --filter=blob:none origin "$KERNEL_COMMIT"
          git -C "$tree" checkout --detach FETCH_HEAD
          actual="$(git -C "$tree" rev-parse "HEAD:$KMI_PATH")"
          test "$actual" = "$KMI_BLOB"
          echo "OPlus KMI symbol-list blob: $actual" >> "$GITHUB_STEP_SUMMARY"

  compile-touched:
    needs:
      - patch-direct
      - kmi-surface
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v7

      - name: Load OnePlus manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          d = json.loads(Path("kernel_patches/patchset.json").read_text(encoding="utf-8"))
          print(f"KERNEL_REPO={d['kernel']['repository']}")
          print(f"KERNEL_COMMIT={d['kernel']['baseline_commit']}")
          print(f"KERNEL_VERSION={d['kernel']['baseline_version']}")
          print(f"KERNEL_PATCH={d['patches']['kernel']}")
          print(f"KSU_REPO={d['kernelsu']['repository']}")
          print(f"KSU_COMMIT={d['kernelsu']['baseline_commit']}")
          print(f"KSU_PATCH={d['patches']['kernelsu']}")
          PY

      - name: Restore exact OnePlus common source archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/susfs/oneplus-common
          key: oneplus13-common-${{ runner.os }}-${{ hashFiles('kernel_patches/patchset.json') }}

      - name: Install LLVM build dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(bc bison flex libssl-dev libelf-dev clang lld llvm)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'ok installed'; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Download exact OnePlus common snapshot and KernelSU
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/oneplus-compile"
          kernel="$root/common"
          ksu="$root/KernelSU"
          cache_dir="$HOME/.cache/susfs/oneplus-common"
          archive="$cache_dir/${KERNEL_COMMIT}.tar.gz"

          rm -rf "$root"
          mkdir -p "$kernel" "$ksu" "$cache_dir"

          if [ ! -s "$archive" ]; then
            tmp="$archive.tmp"
            rm -f "$tmp"
            curl --retry 3 --retry-all-errors -fL \
              "https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750/archive/${KERNEL_COMMIT}.tar.gz" \
              -o "$tmp"
            tar -tzf "$tmp" >/dev/null
            mv "$tmp" "$archive"
          fi

          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" --strip-components=1 -C "$kernel"

          actual="$(
            awk -F= '
              /^VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); v=$2}
              /^PATCHLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); p=$2}
              /^SUBLEVEL[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); s=$2}
              END {print v "." p "." s}
            ' "$kernel/Makefile"
          )"
          test "$actual" = "$KERNEL_VERSION"

          git -C "$kernel" init -q
          git -C "$kernel" config user.name "SUSFS CI"
          git -C "$kernel" config user.email "ci@example.invalid"

          git -C "$ksu" init -q
          git -C "$ksu" remote add origin "$KSU_REPO"
          git -C "$ksu" fetch --depth=1 origin "$KSU_COMMIT"
          git -C "$ksu" checkout --detach FETCH_HEAD
          test "$(git -C "$ksu" rev-parse HEAD)" = "$KSU_COMMIT"

      - name: Apply OnePlus SUSFS integration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/susfs-patchctl.sh apply             --require-direct             --kernel-tree "$RUNNER_TEMP/oneplus-compile/common"             --ksu-tree "$RUNNER_TEMP/oneplus-compile/KernelSU"

      - name: Integrate KernelSU and configure OnePlus GKI
        shell: bash
        run: |
          set -euo pipefail
          kernel="$RUNNER_TEMP/oneplus-compile/common"
          out="$RUNNER_TEMP/oneplus-out"

          ln -sfn ../../KernelSU/kernel "$kernel/drivers/kernelsu"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$kernel/drivers/Makefile"             || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$kernel/drivers/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$kernel/drivers/Kconfig"             || sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' "$kernel/drivers/Kconfig"

          make -C "$kernel" O="$out" ARCH=arm64 LLVM=1 gki_defconfig
          "$kernel/scripts/config" --file "$out/.config"             -e KSU             -e KSU_SUSFS             -e KSU_SUSFS_SUS_PATH             -e KSU_SUSFS_SUS_MOUNT             -e KSU_SUSFS_SUS_KSTAT             -e KSU_SUSFS_SPOOF_UNAME             -e KSU_SUSFS_ENABLE_LOG             -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS             -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG             -e KSU_SUSFS_OPEN_REDIRECT             -e KSU_SUSFS_SUS_MAP
          make -C "$kernel" O="$out" ARCH=arm64 LLVM=1 olddefconfig

          grep -q '^CONFIG_FUSE_BPF=y$' "$out/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$out/.config"

      - name: Compile every SUSFS-touched object
        shell: bash
        run: |
          set -euo pipefail
          kernel="$RUNNER_TEMP/oneplus-compile/common"
          out="$RUNNER_TEMP/oneplus-out"
          targets="$RUNNER_TEMP/oneplus-touched-objects.txt"

          python3 - <<'PY' > "$targets"
          import os
          import re
          from pathlib import Path

          targets = {"fs/susfs.o"}

          for line in Path(os.environ["KERNEL_PATCH"]).read_text(encoding="utf-8").splitlines():
              m = re.match(r"diff --git a/(.+\.c) b/(.+\.c)$", line)
              if m:
                  targets.add(m.group(2)[:-2] + ".o")

          for line in Path(os.environ["KSU_PATCH"]).read_text(encoding="utf-8").splitlines():
              m = re.match(r"diff --git a/kernel/(.+\.c) b/kernel/(.+\.c)$", line)
              if m:
                  targets.add("drivers/kernelsu/" + m.group(2)[:-2] + ".o")

          for target in sorted(targets):
              print(target)
          PY

          echo "Compiling $(wc -l < "$targets") OnePlus touched objects:"
          cat "$targets"

          mapfile -t objects < "$targets"
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi

          make -C "$kernel" O="$out" ARCH=arm64 LLVM=1 -j"$jobs" "${objects[@]}"

  oss-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v7

      - name: Compare OnePlus OSS branch heads with pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          d = json.loads(pathlib.Path("kernel_patches/patchset.json").read_text(encoding="utf-8"))
          items = [
              ("common", d["kernel"]),
              ("vendor", d["vendor_kernel"]),
              ("modules", d["modules_and_devicetree"]),
          ]

          drift = False
          for name, item in items:
              out = subprocess.check_output(
                  ["git", "ls-remote", item["repository"], f"refs/heads/{item['baseline_ref']}"],
                  text=True,
              ).strip()
              head = out.split()[0] if out else ""
              pinned = item["baseline_commit"]
              print(f"{name}: head={head} pinned={pinned}")
              if head != pinned:
                  drift = True

          if drift:
              print("OnePlus OSS has moved; re-audit required.", file=sys.stderr)
              sys.exit(1)
          PY
