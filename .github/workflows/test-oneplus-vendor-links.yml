name: OnePlus 13 vendor symlink closure regression
on:
  push:
    branches:
      - fix/op13-nested-vendor-symlinks
  pull_request:
    branches:
      - vendor/oneplus13-sm8750-a16
    paths:
      - 'tools/oneplus13-workspace.sh'
      - 'tools/test-oneplus-vendor-symlink-closure.sh'
      - '.github/workflows/test-oneplus-vendor-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - name: Syntax
        run: |
          bash -n tools/oneplus13-workspace.sh
          bash -n tools/test-oneplus-vendor-symlink-closure.sh
      - name: Materialize nested official vendor links
        run: bash tools/test-oneplus-vendor-symlink-closure.sh
