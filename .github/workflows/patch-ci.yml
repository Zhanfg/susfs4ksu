name: SUSFS patch compatibility CI

on:
  push:
    branches:
      - "modernize/**"
      - "next-dev"
      - "next"
    paths:
      - "kernel_patches/**"
      - "tools/susfs-patchctl.sh"
      - "tools/verify_unified_diff.py"
      - ".github/workflows/patch-ci.yml"
  workflow_dispatch:

concurrency:
  group: susfs-patch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SUSFS
        uses: actions/checkout@v4

      - name: Load patchset manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          data = json.loads(Path("kernel_patches/patchset.json").read_text(encoding="utf-8"))
          print(f"PATCHSET_LANE={data['lane']}")
          print(f"PATCHSET_VERSION={data['susfs_version']}")
          print(f"PATCHSET_KERNEL_REPO={data['kernel']['repository']}")
          print(f"PATCHSET_KERNEL_BASELINE={data['kernel']['baseline_ref']}")
          print(f"PATCHSET_KERNEL_TRACKING={data['kernel']['tracking_ref']}")
          print(f"PATCHSET_KSU_REPO={data['kernelsu']['repository']}")
          print(f"PATCHSET_KSU_BASELINE={data['kernelsu']['baseline_commit']}")
          print(f"PATCHSET_KERNEL_PATCH={data['patches']['kernel']}")
          print(f"PATCHSET_KSU_PATCH={data['patches']['kernelsu']}")
          PY

      - name: Validate patch tooling and syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/susfs-patchctl.sh
          tools/susfs-patchctl.sh --help >/dev/null
          python3 tools/verify_unified_diff.py

          for patch in kernel_patches/*.patch kernel_patches/KernelSU/*.patch; do
            [ -f "$patch" ] || continue
            git apply --numstat "$patch" >/dev/null
          done

          grep -q "#define SUSFS_VERSION \"$PATCHSET_VERSION\"" kernel_patches/include/linux/susfs.h

      - name: Sparse checkout Android common baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration/common"

          awk '/^diff --git a\// { p=$3; sub(/^a\//, "", p); print "/" p }' "$PATCHSET_KERNEL_PATCH" \
            > "$RUNNER_TEMP/kernel-sparse.txt"

          {
            echo "/Makefile"
            echo "/fs/"
            echo "/include/linux/"
          } >> "$RUNNER_TEMP/kernel-sparse.txt"

          git -C "$RUNNER_TEMP/integration/common" init
          git -C "$RUNNER_TEMP/integration/common" remote add origin "$PATCHSET_KERNEL_REPO"
          git -C "$RUNNER_TEMP/integration/common" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/integration/common" sparse-checkout set --no-cone \
            $(cat "$RUNNER_TEMP/kernel-sparse.txt")
          git -C "$RUNNER_TEMP/integration/common" fetch \
            --depth=1 --filter=blob:none origin "$PATCHSET_KERNEL_BASELINE"
          git -C "$RUNNER_TEMP/integration/common" checkout --detach FETCH_HEAD

          echo "Lane: $PATCHSET_LANE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "AOSP baseline ref: $PATCHSET_KERNEL_BASELINE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "AOSP resolved: $(git -C "$RUNNER_TEMP/integration/common" rev-parse HEAD)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout pinned KernelSU baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration/KernelSU"
          git -C "$RUNNER_TEMP/integration/KernelSU" init
          git -C "$RUNNER_TEMP/integration/KernelSU" remote add origin "$PATCHSET_KSU_REPO"
          git -C "$RUNNER_TEMP/integration/KernelSU" fetch --depth=1 origin "$PATCHSET_KSU_BASELINE"
          git -C "$RUNNER_TEMP/integration/KernelSU" checkout --detach FETCH_HEAD

          test "$(git -C "$RUNNER_TEMP/integration/KernelSU" rev-parse HEAD)" = "$PATCHSET_KSU_BASELINE"
          echo "KernelSU baseline: $PATCHSET_KSU_BASELINE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Preflight real patchset
        shell: bash
        run: |
          set -euo pipefail
          tools/susfs-patchctl.sh check             --kernel-tree "$RUNNER_TEMP/integration/common"             --ksu-tree "$RUNNER_TEMP/integration/KernelSU"

      - name: Apply real patchset
        shell: bash
        run: |
          set -euo pipefail
          tools/susfs-patchctl.sh apply             --kernel-tree "$RUNNER_TEMP/integration/common"             --ksu-tree "$RUNNER_TEMP/integration/KernelSU"

          status="$(
            tools/susfs-patchctl.sh status               --kernel-tree "$RUNNER_TEMP/integration/common"               --ksu-tree "$RUNNER_TEMP/integration/KernelSU"
          )"
          printf '%s\n' "$status"
          grep -q '^kernel_patch=applied$' <<<"$status"
          grep -q '^kernelsu_patch=applied$' <<<"$status"
          grep -q '^current .*fs/susfs.c$' <<<"$status"

      - name: Verify idempotent re-apply
        shell: bash
        run: |
          set -euo pipefail
          tools/susfs-patchctl.sh apply             --kernel-tree "$RUNNER_TEMP/integration/common"             --ksu-tree "$RUNNER_TEMP/integration/KernelSU"
