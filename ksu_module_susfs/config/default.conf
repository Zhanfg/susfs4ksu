# SUSFS Next control-module configuration.
# No spaces around '='. Repeated keys are allowed.
#
# The default profile is intentionally inert except for enabled=1:
# no hiding/spoofing operation is applied until explicitly configured.

enabled=1

# Boolean toggles (0/1)
# logging=0
# avc_log_spoofing=0
# hide_sus_mnts_for_non_su_procs=0

# Static path rules, applied at post-fs-data.
# sus_path=/system/example
# open_redirect=/target/path|/redirected/path|3

# release|version
# uname=default|default

# Path to a prepared cmdline/bootconfig text file.
# cmdline_or_bootconfig=/data/adb/modules/susfs4ksu/config/fake_bootconfig.txt

# Dynamic rules, applied at boot-completed.
# sus_path_loop=/sdcard/example
# sus_map=/system/lib64/example.so
